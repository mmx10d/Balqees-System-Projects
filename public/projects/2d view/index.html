<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="data/style/main.css">
    <title>3d View</title>
</head>
<body>
    <div id="tools">
        <p>scale:</p>
        <span>X</span>
        <input value="1" type="range" class="input">
        <span>Y</span>
        <input value="1" type="range"  class="input">
        <p>rotate:</p>
        <span>X</span>
        <input value="0" type="range" class="input">
        <span>Y</span>
        <input value="0" type="range" class="input">
        <p>translate:</p>
        <span>X</span>
        <input value="0" type="range" class="input">
        <span>Y</span>
        <input value="0" type="range" class="input">
        <p>skew:</p>
        <span>X</span>
        <input value="0" type="range" class="input">
        <span>Y</span>
        <input value="0" type="range" class="input">
    </div>
    <div id="view">
        <img id="img" src="data/img/photo.png">
    </div>
    

<script src="data/js/main.js"></script>
</body>
</html>
