<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X O game</title>
    <link rel="stylesheet" href="data/style.css">
</head>
<body>
    <div class="game">
    <div class="box" id="square1"></div>
    <div class="box" id="square2"></div>
    <div class="box" id="square3"></div>
    <div class="box" id="square4"></div>
    <div class="box" id="square5"></div>
    <div class="box" id="square6"></div>
    <div class="box" id="square7"></div>
    <div class="box" id="square8"></div>
    <div class="box" id="square9"></div>
    </div>
    <div class="setting">
        <div>
            <span>Player One color</span>
            <input type="color" id="p0_color">
        </div>
        <div>
            <span>Player Tow color</span>
            <input type="color" id="p1_color">
            <hr>
        </div>
        <div class="bot_setting">
            <span>Bot Level</span>
            <div>
                <button>Easy</button>
                <button>Hard</button>
            </div>
            <hr>
        </div>
        <button id="def">Default</button>
        <button id="clear_point">Clear point</button>
        <hr>
        <div class="save_cancel">
            <button id="cancel_button">cancel</button>
            <button id="save_button">Save</button>
        </div>
    </div>
    <button id="setting_button">img</button>
    <button id="second">second</button>










    <script src="data/style.js"></script>
</body>
</html>
