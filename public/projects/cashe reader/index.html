<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Cashed Reader</title>
</head>
<body>
    <div class="content">
        <button class="download_btn">&#x2B07;</button>
        <span class="file_type">html</span>
        <!-- player -->
        <div class="player"></div>
        <hr>
        <div class="reader">
            <input type="file" class="filereader" multiple>
            <label for="video">video</label>
            <input type="checkbox" id="video" multiple>
            <label for="img">img/gif</label>
            <input type="checkbox" id="img" multiple>
            <label for="audio">audio</label>
            <input type="checkbox" id="audio" multiple>
            <label for="hidden">hidden</label>
            <input type="checkbox" id="hidden" multiple>
        </div>
        <div class="next"></div>
        <div class="back"></div>
    </div>
<script src="index.js"></script>
</body>
</html>
